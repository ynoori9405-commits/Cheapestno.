<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEAPESTINTNO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#03050a;
  color:#fff;
}
.hero{
  min-height:100vh;width:100%;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  background:#03050a url("background.png") center center/cover no-repeat;
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,20,55,.20),rgba(0,0,0,.15),rgba(60,0,0,.20));
  pointer-events:none;
}
.header{
  position:absolute;top:25px;left:38px;right:38px;
  z-index:2;display:flex;align-items:flex-start;justify-content:space-between;
}
.logo{
  font-size:clamp(25px,4vw,46px);font-weight:900;
  font-style:italic;letter-spacing:-2px;
  text-shadow:0 0 18px #168cff;
}
.tag{
  font-size:11px;letter-spacing:4px;margin-top:4px;
  opacity:.9
}
.owner{
  text-align:right;font-size:11px;letter-spacing:3px;
}
.owner strong{
  display:block;font-size:18px;letter-spacing:0;font-style:italic;
  margin-top:5px;text-shadow:0 0 15px #ff3055;
}
.lock{
  position:relative;z-index:3;
  width:min(620px,86vw);
  padding:42px 32px;
  border:1px solid rgba(65,170,255,.75);
  border-radius:20px;
  background:rgba(2,8,20,.78);
  backdrop-filter:blur(7px);
  box-shadow:0 0 40px rgba(0,119,255,.28), inset 0 0 35px rgba(0,100,255,.08);
  text-align:center;
}
.lock:before,.lock:after{
  content:"";position:absolute;width:45px;height:45px;
  border-color:#27a4ff;border-style:solid;opacity:.9;
}
.lock:before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:20px 0 0 0}
.lock:after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 20px 0}
.icon{
  width:64px;height:64px;border:2px solid #25a4ff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;font-size:30px;
  box-shadow:0 0 25px rgba(0,157,255,.65);
}
h1{font-size:clamp(24px,4vw,38px);margin:0 0 14px}
.msg{font-size:clamp(18px,3vw,26px);line-height:1.45}
.aman{color:#39a9ff;font-size:1.35em;font-weight:900;font-style:italic;text-shadow:0 0 16px #087cff}
.god{
  margin-top:19px;font-size:clamp(27px,5vw,48px);font-weight:900;
  font-style:italic;letter-spacing:1px;color:#fff;
  text-shadow:0 0 12px #168cff,0 0 30px rgba(255,255,255,.45)
}
.footer{
  position:absolute;z-index:3;bottom:18px;left:38px;right:38px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;letter-spacing:3px;opacity:.85;
}
@media(max-width:600px){
 .header{top:18px;left:18px;right:18px}
 .footer{left:18px;right:18px}
 .owner{font-size:9px}.owner strong{font-size:14px}
 .lock{padding:34px 20px}
}
</style>
</head>
<body>
<div class="hero">
  <header class="header">
    <div>
      <div class="logo">CHEAPESTINTNO</div>
      <div class="tag">FAST &nbsp; • &nbsp; SECURE &nbsp; • &nbsp; RELIABLE</div>
    </div>
    <div class="owner">OWNER<strong>Kai, Tyson</strong></div>
  </header>

  <section class="lock">
    <div class="icon">🔒</div>
    <h1>Access Permission Required</h1>
    <div class="msg">First take permission from <span class="aman">Aman</span><br>than you can use it</div>
    <div class="god">𝐊ᴀɪ 𝐈s 𝐆ᴏᴅ</div>
  </section>

  <footer>
    <span>CHEAPESTINTNO</span>
    <span>— TRUST ONLY THE REAL —</span>
  </footer>
</div>
</body>
</html>
